name: CI

# First CI for monet-core. The gate is deterministic and offline
# because the unit tests construct the lexical hashing embedder DIRECTLY (no model download),
# and the MiniLM eval.onnx test stays skipped unless MONET_EVAL_ONNX=1 — so the eval regression
# gate (src/__tests__/eval.test.ts) is reproducible run-to-run. The real semantic eval (MiniLM)
# runs separately in eval-nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    # Defense-in-depth only: the tests already hard-wire the hashing embedder, so this just
    # forces the lexical fallback for any future code path that happens to read the env var.
    env:
      MONET_EMBEDDER: hashing
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version is read from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The root "prepare" script runs tsup during install, so dist is built here too; the
      # explicit Build step below is kept as the legible, named build gate.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (includes the deterministic eval regression gate)
        run: pnpm test

      - name: Build
        run: pnpm build
