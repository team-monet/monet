name: Eval (MiniLM, nightly)

# The real-recall gate. Runs the eval suite on the actual shipping
# embedder (all-MiniLM-L6-v2 via @huggingface/transformers) — too slow/networked for every PR,
# so it runs nightly and on demand. src/__tests__/eval.onnx.test.ts FAILS the job on a
# semantic-recall regression; `pnpm eval` is also captured as a human-readable artifact.
#
# Note: scheduled runs only fire from the default branch. Use the "Run workflow" button
# (workflow_dispatch) to trigger it on a branch.

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC nightly (off the top of the hour, per GitHub guidance)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minilm-eval:
    name: MiniLM recall gate + report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # onnxruntime-node ships a prebuilt linux/x64 binary inside the package (no build script),
      # so a plain install yields a working MiniLM on ubuntu-latest — no approve-builds needed.
      - name: Install dependencies (incl. optional @huggingface/transformers)
        run: pnpm install --frozen-lockfile

      # embedding-onnx.ts pins transformers.js's cache to ~/.monet/models (#90), so cache THAT path.
      # It used to point inside node_modules, which is where transformers defaults on its own; after
      # the pin that path is never written and this step would silently cache nothing, re-downloading
      # ~450MB every night. Unlike the node_modules path this one survives install, so it no longer
      # depends on step ordering. Best-effort: a miss just re-downloads. Any pnpm-lock.yaml change
      # busts the exact key, but the restore-keys prefix still reuses the previous cache.
      - name: Cache the MiniLM model
        uses: actions/cache@v4
        with:
          path: ~/.monet/models
          key: minilm-model-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            minilm-model-${{ runner.os }}-

      # Two explicit vitest positional filters, not one: "eval.onnx" matches ONLY
      # eval.onnx.test.ts (eval-baseline.onnx.test.ts does not contain that substring), so the
      # Phase 0 md-baseline gate needs its own filter listed here rather than assuming the
      # existing pattern already covers it — verified by running both filters together locally
      # before wiring this in.
      - name: MiniLM recall gate (fails the job on a semantic-recall regression)
        env:
          MONET_EVAL_ONNX: "1"
        run: pnpm exec vitest run --dir src eval.onnx eval-baseline.onnx

      - name: Capture the eval report
        if: always()
        run: pnpm -s eval --embedder=onnx --verbose | tee eval-report.txt

      - name: Capture the md-baseline eval report (bm25, chunk-cosine-rag, md-tree)
        if: always()
        run: pnpm -s eval:baseline --embedder=onnx --verbose | tee eval-baseline-report.txt

      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minilm-eval-report
          path: eval-report.txt
          if-no-files-found: warn

      - name: Upload the md-baseline eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minilm-eval-baseline-report
          path: eval-baseline-report.txt
          if-no-files-found: warn
