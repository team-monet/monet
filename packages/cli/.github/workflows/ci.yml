name: CI

# Build gate for the closed client. Because @team-monet/core is now a
# file: dependency pointing to the private sibling repo, CI must check out
# both repos to build. PRs from forks do not have access to MONET_CORE_TOKEN;
# only PRs from branches within team-monet/monet will pass this gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monet-client
        uses: actions/checkout@v4
        with:
          path: monet-client

      - name: Checkout monet-core (private)
        uses: actions/checkout@v4
        with:
          repository: team-monet/monet-core
          token: ${{ secrets.MONET_CORE_TOKEN }}
          path: monet-core

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: monet-client/pnpm-lock.yaml

      - name: Install core dependencies
        working-directory: monet-core
        run: pnpm install --frozen-lockfile

      - name: Build core
        working-directory: monet-core
        run: pnpm build

      - name: Install client dependencies
        working-directory: monet-client
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: monet-client
        run: pnpm typecheck

      - name: Test
        working-directory: monet-client
        run: pnpm test

      - name: Build
        working-directory: monet-client
        run: pnpm build
