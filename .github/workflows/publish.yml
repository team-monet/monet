name: Publish CLI

# Runs on a version tag (v1.x.x) or a manual trigger.
# Publishes the @team-monet/monet artifact (packages/cli) to public npm via OIDC
# trusted publishing, then publishes packages/cli/server.json to the official MCP
# registry (registry.modelcontextprotocol.io) so the two never diverge again.
#
# Both use OIDC and neither needs a secret. To re-sync only the registry entry —
# without cutting an npm release — dispatch this workflow with registry_only=true.
#
# OIDC trusted publishing (token-less):
#   Configure at npmjs.com → @team-monet/monet → Settings → Publishing → Trusted Publishers.
#   Add a GitHub Actions publisher:
#     Repository:        team-monet/monet
#     Workflow filename: publish.yml
#     Environment:       (leave blank — this workflow uses no GitHub environment)
#   Then enable "Allow publish" (npm's post-May-2026 required toggle).
#   No NPM_TOKEN secret needed. The id-token: write permission below is what unlocks OIDC.
#
# NO --provenance: provenance stays OFF, and NPM_CONFIG_PROVENANCE=false keeps it off even
#   though npm turns provenance on by default for public repos. The original reason — a
#   separate private core repo that must not be linked via attestations — no longer holds:
#   core and cli are one repository. Whether to re-enable provenance is an OPEN DECISION,
#   not a settled policy; nothing here argues against it.
#
# NO SECRETS REQUIRED. This workflow used to check out packages/core from a separate private
# repository with MONET_CORE_TOKEN, and to pin that checkout by sha from packages/cli/.monet-core-ref
# so a tag could not publish against un-reviewed core code. Both are gone: core and cli are one
# repository now, so the tag being built already names exactly one revision of both, and the
# workspace link resolves core without a second checkout. The pin file is deleted, not disabled —
# there is nothing left for it to pin.

# Never cancel an in-flight publish — a partial publish is worse than a duplicate attempt.
concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (pack but do not publish)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      registry_only:
        description: "Skip npm, publish only the MCP registry manifest (use to re-sync a drifted registry entry)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing to npm.

jobs:
  publish:
    name: Build artifact and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version is read from the ROOT package.json "packageManager"
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Ensure npm >= 11.5.1 for OIDC trusted publishing support.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build core first: packages/cli's esbuild bundle inlines @team-monet/core's dist.
      - name: Build core
        run: pnpm --filter @team-monet/core build

      # Build the esbuild bundle (minified, no sourcemaps, no comments). The minification
      # and sourcemap suppression were introduced in June to keep the engine source out of
      # the published artifact; under AGPL that purpose is gone, so whether to ship
      # sourcemaps again is an OPEN DECISION, tracked with the provenance one.
      - name: Build client artifact
        run: pnpm --filter @team-monet/monet build

      # Smoke-check the tarball contents before publishing.
      #
      # Both this and the publish below run packages/cli's `prepack` hook
      # (scripts/strip-dev-deps.mjs), which deletes devDependencies from the packed manifest.
      # That hook is now doing a second job on top of hiding build tooling: `@team-monet/core`
      # is a devDependency carrying the `workspace:*` specifier, which npm cannot resolve. It
      # must not reach the tarball, and stripping devDependencies is what keeps it out.
      - name: Verify tarball (no source, no sourcemap)
        working-directory: packages/cli
        run: npm pack --dry-run

      # packages/cli/server.json is the manifest the official MCP registry serves. It carries
      # the version in two places — top level and packages[0] — and nothing else in the build
      # reads either one, so it drifts in silence. It did: the registry entry sat at 1.2.4
      # naming the archived team-monet/with-monet repository while npm was on 1.6.3, because
      # the manifest was committed and no workflow ever published it.
      #
      # THIS RUNS BEFORE THE NPM PUBLISH, and the order is the point. An npm version is
      # immutable once published; a drifted manifest caught afterwards would leave the release
      # half-shipped, with npm advanced and the registry stranded, and no way to take it back.
      # Everything here is local, so it costs nothing to fail first.
      - name: Check server.json agrees with the package
        working-directory: packages/cli
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const versions = [srv.version, ...srv.packages.map((p) => p.version)];
            const drifted = versions.filter((v) => v !== pkg.version);
            if (drifted.length > 0) {
              console.error(`server.json version(s) ${drifted.join(", ")} != package.json ${pkg.version}`);
              process.exit(1);
            }
            if (!srv.packages.some((p) => p.identifier === pkg.name)) {
              console.error(`server.json names no package with identifier ${pkg.name}`);
              process.exit(1);
            }
            // srv.name is the registry IDENTITY, and the namespace OIDC authorises. It is not
            // implied by the version or the npm identifier, so drift here would publish under
            // a different name — or fail authorisation — with npm already out the door.
            if (srv.name !== pkg.mcpName) {
              console.error(`server.json name ${srv.name} != package.json mcpName ${pkg.mcpName}`);
              process.exit(1);
            }
            // The repository this manifest points readers at. A move that updates one side and
            // not the other publishes a registry entry aimed at a repository that is gone —
            // which is the exact failure this workflow exists to end, so it is checked here.
            const repoUrl = (u) => String(u || "").replace(/^git\+/, "").replace(/\.git$/, "").replace(/\/$/, "");
            if (repoUrl(srv.repository?.url) !== repoUrl(pkg.repository?.url)) {
              console.error(`server.json repository ${repoUrl(srv.repository?.url)} != package.json ${repoUrl(pkg.repository?.url)}`);
              process.exit(1);
            }
            if ((srv.repository?.subfolder || "") !== (pkg.repository?.directory || "")) {
              console.error(`server.json subfolder ${srv.repository?.subfolder} != package.json directory ${pkg.repository?.directory}`);
              process.exit(1);
            }
            console.log(`server.json agrees: ${srv.name} / ${pkg.name}@${pkg.version} @ ${repoUrl(srv.repository?.url)}/${srv.repository?.subfolder}`);
          '

      # Pinned deliberately, not tracked to latest: this binary runs in a job holding
      # id-token: write, so an unreviewed upgrade lands with registry-publishing rights.
      # Bump it on purpose.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher

      # ALSO BEFORE THE NPM PUBLISH, for the same reason as the agreement check above, and
      # covering what that check cannot: the agreement check compares this manifest against
      # package.json, while this one holds it against the registry's schema. A manifest can
      # agree with the package perfectly and still be rejected by the registry, so both have
      # to clear before the immutable half of the release goes out.
      #
      # Runs on dry runs too — a manifest that cannot validate should surface before a tag.
      - name: Validate the server manifest
        working-directory: packages/cli
        run: mcp-publisher validate

      # Publish to npm via OIDC trusted publishing (no NPM_TOKEN needed).
      # --access public is required for scoped packages on first publish; safe to repeat.
      # NO --provenance flag. NPM_CONFIG_PROVENANCE=false is set explicitly so provenance
      # stays OFF even once this repo is public (npm enables it by default on public repos).
      # See the header note: the private-core-repo reason is gone, and re-enabling
      # provenance is an open decision rather than a settled one.
      #
      # By this line everything that can fail locally already has: the manifest agrees with
      # the package and satisfies the registry schema. What remains after this is the network
      # half — the registry publish — which can be retried, unlike an npm version.
      - name: Publish to npm (OIDC trusted publishing)
        if: ${{ inputs.dry_run != 'true' && inputs.registry_only != 'true' }}
        working-directory: packages/cli
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: npm publish --access public

      # github-oidc needs no secret: it exchanges this job's OIDC token, and the
      # io.github.team-monet/* namespace is authorised by this repository's owner.
      - name: Publish to the MCP registry (GitHub Actions OIDC)
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: packages/cli
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
